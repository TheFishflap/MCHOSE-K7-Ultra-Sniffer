# Kein Bluetooth-Stack, wir wollen direkten Zugriff aufs RADIO-Peripheral
CONFIG_BT=n

# Logging/Konsole ueber USB-CDC (XIAO nRF52840 hat kein separates Debug-UART
# auf einfach zugaenglichen Pins; USB ist der bequeme Weg).
#
# Das Board xiao_ble/nrf52840 konfiguriert dafuer standardmaessig bereits
# den NEUEN USB-Geraetestack (device_next/USBD) fuer die Konsole ueber
# Devicetree (zephyr,console chosen node). CONFIG_USB_DEVICE_STACK=y wuerde
# zusaetzlich den ALTEN, veralteten Stack aktivieren, der denselben
# Devicetree-Knoten nochmal registriert -> Linker-Fehler "multiple
# definition of __device_dts_ord_...". Deshalb hier NICHT explizit setzen,
# nur Konsole/Serial aktivieren, Rest macht die Boardkonfiguration.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

CONFIG_PRINTK=y
# LOG aus: das Log-Subsystem (inkl. <inf> udc_nrf Boot-Logs) hat beim
# Paket-Mitschnitt den Konsolenpuffer ueberladen -> "N messages dropped"
# und ANSI-Farbcodes mitten in unseren Hex-Zeilen. Fuer den Sniffer wollen
# wir nur sauberes, synchrones printk.
CONFIG_LOG=n

# Etwas mehr Stack fuer main, falls spaeter mehr Logik dazukommt
CONFIG_MAIN_STACK_SIZE=2048
